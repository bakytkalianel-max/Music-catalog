<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Ақылды маршрут генераторы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            padding: 40px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
        }

        button {
            background: #0b8f6a;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .result {
            background: #eefaf6;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Ақылды маршрут генераторы</h2>

    <form method="POST">
        <label>Қаланы таңдаңыз:</label>
        <select name="city">
            <option value="almaty">Алматы</option>
            <option value="astana">Астана</option>
            <option value="turkistan">Түркістан</option>
        </select>

        <label>Күн саны:</label>
        <select name="days">
            <option value="1">1 күн</option>
            <option value="2">2 күн</option>
            <option value="3">3 күн</option>
        </select>

        <label>Қызығушылық:</label>
        <select name="interest">
            <option value="nature">Табиғат</option>
            <option value="history">Тарих</option>
        </select>

        <button type="submit">Маршрут құру</button>
    </form>

    {% if result %}
        <div class="result">
            <h3>Сіздің маршрутыңыз:</h3>
            {% for item in result %}
                <p>{{ item }}</p>
            {% endfor %}
        </div>
    {% endif %}
</div>
</body>
</html>
