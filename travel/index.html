<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Kazakhstan Travel Wheel</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  background: #07111f;
  color: white;
}

h1 {
  margin-top: 30px;
}

.wheel-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin: 40px auto;
}

.pointer {
  position: absolute;
  top: -25px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 30px;
}

#wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 8px solid white;
  transition: transform 4s ease-out;
  background: conic-gradient(
    #00c896 0deg 60deg,
    #0099ff 60deg 120deg,
    #ff7b00 120deg 180deg,
    #8e44ad 180deg 240deg,
    #e84393 240deg 300deg,
    #f1c40f 300deg 360deg
  );
}

button {
  padding: 12px 30px;
  font-size: 18px;
  background: #00c896;
  border: none;
  border-radius: 30px;
  color: white;
  cursor: pointer;
}

.result {
  margin-top: 30px;
}
</style>
</head>

<body>

<h1>Kazakhstan Travel Wheel</h1>

<div class="wheel-container">
  <div class="pointer">▼</div>
  <div id="wheel"></div>
</div>

<button onclick="spin()">SPIN</button>

<div class="result" id="result"></div>

<script>
let rotation = 0;

const places = [
  "Алматы",
  "Маңғыстау",
  "Түркістан",
  "Көлсай",
  "Шарын",
  "Бурабай"
];

function spin() {
  const wheel = document.getElementById("wheel");
  const result = document.getElementById("result");

  const randomIndex = Math.floor(Math.random() * places.length);
  const deg = 360 / places.length;

  // дәл секторға тоқтайды
  const finalDeg = 360 * 6 + (360 - randomIndex * deg - deg / 2);

  rotation += finalDeg;

  wheel.style.transform = rotate(${rotation}deg);

  result.innerHTML = "Айналып жатыр...";

  setTimeout(() => {
    result.innerHTML = `
      <h2>Сенің бағытың: ${places[randomIndex]}</h2>
    `;
  }, 4000);
}
</script>

</body>
</html>
